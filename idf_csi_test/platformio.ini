; SpecificDeviceCSIのRX。素のESP-IDF(Arduino非経由)プロジェクト。
; TXは ../idf_csi_test_tx/ （元祖ESP32）。詳細はdocs/research_log.md #22-#24参照。
; RXはAtomS3 Lite(ESP32-S3)固定。全サブキャリア出力するためデータ量が多く、
; 高ボーレートにしている（S3はネイティブUSBなので実質のスループットは
; 物理UARTより余裕がある）。

[env:atoms3-lite-rx-idf]
platform = espressif32@7.1.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 2000000
