; Arduino frameworkがCSI取得不可の原因かどうかを切り分けるための、
; 独立したESP-IDF(素のIDF、Arduino非経由)プロジェクト。
; 詳細はプロジェクトルートのdocs/research_log.md #23を参照。
;
; TXは親プロジェクト(../)のsrc/csi_tx.cpp（env:m5atom-lite-tx、元祖ESP32）を
; そのまま使う。RXはAtomS3 Lite(ESP32-S3)固定——ArduinoでのRX=S3検証(#23)と
; チップを揃え、フレームワークだけを変えて切り分けるため。

[env:atoms3-lite-rx-idf]
platform = espressif32@7.1.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
