; SpecificDeviceCSIのRX。素のESP-IDF(Arduino非経由)プロジェクト。
; TXは ../idf_csi_test_tx/ （元祖ESP32）。詳細はdocs/research_log.md #22-#24参照。
; RXはAtomS3 Lite(ESP32-S3)固定。全サブキャリア出力するためデータ量が多く、
; 高ボーレートにしている（S3はネイティブUSBなので実質のスループットは
; 物理UARTより余裕がある）。

[env:atoms3-lite-rx-idf]
platform = espressif32@7.1.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 2000000

; RXを元祖ESP32(ATOM Lite、外付けFTDI経由の実UART)にした場合の検証用。
; CSIコールバックが元祖ESP32でも同じ修正(Kconfig有効化+レート指定)で
; マッチするか、および実UARTの方がS3のネイティブUSBよりスループットが
; 出るかを確認する。TXは../idf_csi_test_tx/のまま(元祖ESP32)を使う。
[env:m5atom-lite-rx-idf]
platform = espressif32@7.1.0
board = m5stack-atom
framework = espidf
monitor_speed = 115200
