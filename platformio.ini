; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; src/にはRouterCSI用main.cppの他、SpecificDeviceCSI用のcsi_tx.cpp/csi_rx.cppが
; 同居している。Arduino frameworkはsetup()/loop()が1組しか許容されないため、
; 各envでbuild_src_filterにより使わないファイルを明示的に除外している。

[env:esp32-s3]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<csi_tx.cpp> -<csi_rx.cpp>

[env:xiao-c3]
platform = espressif32@6.13.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_src_filter = +<*> -<csi_tx.cpp> -<csi_rx.cpp>

[env:m5atom-lite]
platform = espressif32@6.13.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_src_filter = +<*> -<csi_tx.cpp> -<csi_rx.cpp>

; ---- SpecificDeviceCSI（TX/RX分離構成）----
; Espressif公式esp-csiのexamples/get-started/csi_send・csi_recvを
; Arduino/PlatformIOに移植したもの。ATOM Lite(ESP32無印)専用。

; RouterCSI用のenvとはあえて別のplatformバージョンにしている。
; 元祖ESP32でのpromiscuous+ESP-NOW CSIが esp-csi issue #247 関連の
; 既知の不具合に当たったため、より新しいESP-IDFを試すためのもの。

[env:m5atom-lite-tx]
platform = espressif32@7.1.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_src_filter = +<csi_tx.cpp>

[env:m5atom-lite-rx]
platform = espressif32@7.1.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
build_src_filter = +<csi_rx.cpp>

; RXのチップを変えての切り分け用（#22参照）。TXは元祖ESP32(m5atom-lite-tx)の
; ままにし、RXだけAtomS3 Lite(ESP32-S3)に差し替えて同じcsi_rx.cppを使う。
[env:atoms3-lite-rx]
platform = espressif32@7.1.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<csi_rx.cpp>

; Arduino frameworkが原因かどうかの切り分け用（#23参照）。素のESP-IDF版は
; 独立したPlatformIOプロジェクト `idf_csi_test/` に分離した
; （src_dirはenv単位で切り替えられないため、同居させると競合するので別プロジェクト化）。
; そちらのRXは元祖ESP32(m5stack-atom)固定なので、TXをAtomS3 Lite(S3)にして
; 手元の2台（無印+S3）だけで検証できるようにする
; （TX側のチップはCSI抽出と無関係なので、S3でも問題ない）。
[env:atoms3-lite-tx]
platform = espressif32@7.1.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<csi_tx.cpp>
