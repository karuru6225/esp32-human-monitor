services:
  backend:
    build: ./backend
    ports:
      - "8765:8765"
    environment:
      - CSI_SOURCE=tcp
      - CSI_TCP_SOURCES=A:host.docker.internal:9000,B:host.docker.internal:9001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
