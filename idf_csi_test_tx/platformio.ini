; SpecificDeviceCSIのTX、素のESP-IDF版（Arduinoのesp_now実装には無い
; esp_now_set_peer_rate_config()を使うための独立プロジェクト）。
; RXは ../idf_csi_test/ （AtomS3 Lite, ESP32-S3）。
; 詳細はプロジェクトルートのdocs/research_log.mdを参照。

[env:m5atom-lite-tx-idf]
platform = espressif32@7.1.0
board = m5stack-atom
framework = espidf
monitor_speed = 115200
